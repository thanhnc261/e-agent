[project]
name = "e-agent-plugin-sdk"
version = "0.1.0"
description = "Public ports, manifests and plugin lifecycle for e-agent"
requires-python = ">=3.12"
dependencies = ["e-agent-contracts>=0.1,<0.2", "pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/sdk"
