[project]
name = "e-agent-adapter-odoo"
version = "0.1.0"
description = "Odoo 19 JSON-2 provider adapter for e-agent (bridge commands, ADR 0005)"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk[http]>=0.1,<0.2",
    "e-agent-domain-erp>=0.1,<0.2",
]

[project.entry-points."e_agent.plugins.v1"]
odoo19 = "e_agent.adapters.odoo.plugin:create_plugin"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/adapters/odoo"
