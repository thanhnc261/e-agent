[project]
name = "e-agent-adapter-agent-pydantic"
version = "0.1.0"
description = "Pydantic AI 2.x agent driver for e-agent (deferred-only tools, ADR 0004)"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk>=0.1,<0.2",
    "pydantic-ai-slim[openai]>=2.54,<3",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/adapters/pydantic_ai"
