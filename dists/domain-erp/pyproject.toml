[project]
name = "e-agent-domain-erp"
version = "0.1.0"
description = "ERP business domain pack: bounded contexts, capabilities, rules and verifiers"
requires-python = ">=3.12"
dependencies = ["e-agent-contracts>=0.1,<0.2", "e-agent-plugin-sdk>=0.1,<0.2", "pydantic>=2.13,<3"]

[project.entry-points."e_agent.plugins.v1"]
domain-erp = "e_agent.erp.plugin:create_plugin"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/erp"
