[project]
name = "e-agent-kernel"
version = "0.1.0"
description = "Domain-neutral run coordination, action gateway, approval and plugin registry"
requires-python = ">=3.12"
dependencies = ["e-agent-contracts>=0.1,<0.2", "e-agent-plugin-sdk>=0.1,<0.2"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/kernel"
