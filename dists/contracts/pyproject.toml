[project]
name = "e-agent-contracts"
version = "0.1.0"
description = "Portable wire records for e-agent (no framework or vendor types)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/contracts"
