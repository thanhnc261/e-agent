[project]
name = "e-agent-adapter-secretstore-local"
version = "0.1.0"
description = "Local envelope-encrypted SecretStore for e-agent (MVP; ADR 0012/0013)"
requires-python = ">=3.12"
dependencies = [
    "e-agent-plugin-sdk>=0.1,<0.2",
    "cryptography>=45",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/adapters/secretstore_local"
