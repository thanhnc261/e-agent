[project]
name = "e-agent-adapter-postgres"
version = "0.1.0"
description = "PostgreSQL RunStore for e-agent: durable run/action ledger, migrations"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk>=0.1,<0.2",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.2,<4",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/adapters/postgres"
