[project]
name = "e-agent-adapter-shacl"
version = "0.1.0"
description = "SHACL validation engine adapter (pySHACL) for e-agent validation datasets"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk>=0.1,<0.2",
    "pyshacl>=0.40,<0.41",
    "rdflib>=7.6,<8",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/adapters/shacl"
