[project]
name = "e-agent-server"
version = "0.1.0"
description = "e-agent composition root: bootstrap, CLI and (later) HTTP API"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk>=0.1,<0.2",
    "e-agent-kernel>=0.1,<0.2",
    "e-agent-domain-erp>=0.1,<0.2",
    "e-agent-adapter-shacl>=0.1,<0.2",
    "e-agent-adapter-postgres>=0.1,<0.2",
    "e-agent-adapter-agent-pydantic>=0.1,<0.2",
    "e-agent-adapter-secretstore-local>=0.1,<0.2",
    "e-agent-adapter-odoo>=0.1,<0.2",
    "fastapi>=0.142,<1",
    "uvicorn>=0.37,<1",
]

[project.scripts]
e-agent = "e_agent.server.cli:main"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../../src"]

[tool.hatch.build.hooks.custom]
path = "../_hooks/src_tree.py"
package = "e_agent/server"
