# e-agent development harness: context manifest (harness plan H1).
# Paths are those of the current checkout; roadmap Phase 1b moves docs and
# updates this file. tests/conformance/test_harness_context.py checks it.

[authoritative]
# Ordered. A task pins the digest of these files; a change invalidates the task.
files = [
  "AGENTS.md",
  "CLAUDE.md",
  "docs/roadmap.md",
  "docs/design/high-level-design.md",
  "docs/design/mvp-detailed-design.md",
  "docs/design/target-architecture.md",
  "docs/adr/README.md",
]
active_plan = "docs/plans/2026-10-20-phase4-conversation-chat.md"
# From roadmap Phase 2 on, plans also need "Toggles and fallback" and "Gate"
# sections (harness plan, eng-phase-plan).
active_plan_required_sections = ["Global Constraints", "Review Focus", "Toggles and fallback", "Gate"]

[protected]
read_only = ["archive/**", "research/**"]
# Owner decision 2026-10-13: new studies may be created under research/; existing reports stay as written.
create_only = ["research/**"]
bump_required = ["addons/**"]
bump_file = "addons/e_agent_bridge/__manifest__.py"
secrets = ["profiles/*.local.json", ".env", "~/.config/e-agent/**"]

[environment]
# Roadmap rule 5: only the odoo19-learning sandbox and containers e-agent creates.
allowed_containers = ["odoo19-learning-*", "e-agent-ledger", "e-agent-test-*"]
denied_containers = ["odoo-bench*"]
denied_paths = [
  "**/enterprise-agent/experiment/**",
  "**/ERP-Bench/**/solution/**",
  "**/ERP-Bench/**/tests/**",
  # Claude Code's own configuration outside the repository (trust, global permissions):
  # the check-scope hook allows writes outside every harness checkout unless listed here.
  "**/.claude.json",
  "**/.claude/settings.json",
  "**/.claude/settings.local.json",
]

[gates]
quick = ["uv run ruff check .", "uv run ruff format --check .", "uv run pytest -q {package}"]
full = [
  "uv sync --locked",
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run mypy",
  "uv run lint-imports",
  "uv run python scripts/export_openapi.py --check",
  "uv run pytest -q",
  "pnpm --dir ui gen:check",
  "pnpm --dir ui check",
  "uv run python scripts/check_core_only.py",
]
# UI type check, unit tests, layer and neutrality rules, build (pilot log HP-12).
ui = ["pnpm --dir ui check"]
pg = ["E_AGENT_TEST_STORE=postgres uv run pytest -q tests/unit/kernel tests/conformance tests/unit/adapters/postgres tests/unit/server/test_conversation_api.py tests/unit/server/test_conversation_e2e.py"]
e2e = ["make e2e"]
# Core wheels and a non-ERP test pack install without any ERP wheel; the server starts (Task 1d.8).
core = ["uv run python scripts/check_core_only.py"]
live = ["uv run python scripts/env_check.py", "uv run python scripts/odoo_sandbox.py info"]

# The Postgres tests truncate their database, and any gate whose pytest run sees
# E_AGENT_TEST_PG_DSN uses it. The test database must have its own name, never the
# live ledger's (pilot log HP-13). "*" applies to every gate set.
[gate_guards."*"]
distinct_databases = [["E_AGENT_TEST_PG_DSN", "E_AGENT_PG_DSN"]]

[gate_guards.pg]
require_env = ["E_AGENT_TEST_PG_DSN"]

[roles]
# Skills land in harness phase H3; names are checked for shape only until then.
implementer = "eng-implement"
reviewer = "eng-review"
verifier = "eng-verify"
sandbox = "live-sandbox"

[status]
token_budget = 1500
language_order = ["vi-eli5", "en"]
