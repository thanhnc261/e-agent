[project]
name = "e-agent-harness"
version = "0.1.0"
description = "Development harness for e-agent: context manifest, task contracts, scope and gate checks (never a product dependency)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
e-agent-harness = "e_agent_harness.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e_agent_harness"
