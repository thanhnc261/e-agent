name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, architecture, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: e_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      E_AGENT_TEST_PG_DSN: postgresql://postgres:ci@localhost:5432/e_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: OpenAPI document is current
        run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest -q
      - name: release task matrix (fixture)
        run: uv run python scripts/release_report.py --out "$RUNNER_TEMP/release.json"
      - name: kernel suite against the PostgreSQL ledger
        run: uv run pytest -q tests/unit/kernel tests/conformance tests/unit/adapters/postgres
        env:
          E_AGENT_TEST_STORE: postgres

  wheels:
    name: independent wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/check_wheels.py
      - run: uv run python scripts/check_core_only.py

  ui:
    name: UI layers, conformance (default, overlay, reference)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: .
      - name: OpenAPI document and generated TS types/tokens are current
        run: |
          uv run python ../scripts/export_openapi.py --check
          pnpm gen:check
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm conformance
        env:
          CI: "1"

  security:
    name: secret scan and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash -eo pipefail: a failing stage of any pipeline fails the step.
        shell: bash
    env:
      GITLEAKS_VERSION: "8.28.0"
      # SHA-256 of gitleaks_8.28.0_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
      PIP_AUDIT_VERSION: "2.9.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$(git rev-parse --is-shallow-repository)" = false
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --no-color -c .gitleaks.toml . 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          scanned="$(grep -oE '[0-9]+ commits scanned' "$RUNNER_TEMP/gitleaks.log" | grep -oE '^[0-9]+' || true)"
          echo "gitleaks: ${scanned:-0} commits scanned"
          test "${scanned:-0}" -gt 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: pip-audit over the exported lock
        run: |
          uv export --frozen --format requirements-txt --no-hashes --no-emit-workspace -o "$RUNNER_TEMP/requirements.txt"
          # An advisory is ignored only with --ignore-vuln <id> and a comment giving the reason.
          # pip-audit exits non-zero on a vulnerability, which fails the step before the count.
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --format json --output "$RUNNER_TEMP/pip-audit.json"
          # Count what pip-audit audited, not requirement lines: markers and skipped entries do not count.
          audited="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["dependencies"]; print(sum(1 for e in d if "skip_reason" not in e))' "$RUNNER_TEMP/pip-audit.json")"
          echo "pip-audit: audited ${audited} packages"
          test "${audited}" -gt 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: pnpm audit of production dependencies
        run: |
          pnpm --dir ui audit --prod
          total="$(pnpm --dir ui audit --prod --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["totalDependencies"])')"
          echo "pnpm audit: audited ${total} production dependencies"
          test "${total}" -gt 0
