name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, architecture, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: e_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      E_AGENT_TEST_PG_DSN: postgresql://postgres:ci@localhost:5432/e_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: OpenAPI document is current
        run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest -q
      - name: kernel suite against the PostgreSQL ledger
        run: uv run pytest -q packages/kernel
        env:
          E_AGENT_TEST_STORE: postgres

  wheels:
    name: independent wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/check_wheels.py

  ui:
    name: UI layers, conformance (default, overlay, reference)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: .
      - name: OpenAPI document and generated TS types/tokens are current
        run: |
          uv run python ../scripts/export_openapi.py --check
          pnpm gen:check
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm conformance
        env:
          CI: "1"
