[project]
name = "e-agent-workspace"
version = "0.0.0"
description = "Workspace root for e-agent (tooling only; not a distribution)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "e-agent-contracts",
    "e-agent-plugin-sdk",
    "e-agent-kernel",
    "e-agent-domain-erp",
    "e-agent-server",
    "e-agent-adapter-shacl",
    "e-agent-adapter-postgres",
    "e-agent-adapter-agent-pydantic",
    "e-agent-adapter-secretstore-local",
    "e-agent-adapter-odoo",
    "e-agent-adapter-erp-simulator",
    "e-agent-erp",
    "e-agent-harness",
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["dists/*", "tools/harness"]
exclude = ["dists/_hooks"]

[tool.uv.sources]
e-agent-contracts = { workspace = true }
e-agent-plugin-sdk = { workspace = true }
e-agent-kernel = { workspace = true }
e-agent-domain-erp = { workspace = true }
e-agent-server = { workspace = true }
e-agent-adapter-shacl = { workspace = true }
e-agent-adapter-postgres = { workspace = true }
e-agent-adapter-agent-pydantic = { workspace = true }
e-agent-adapter-secretstore-local = { workspace = true }
e-agent-adapter-odoo = { workspace = true }
e-agent-adapter-erp-simulator = { workspace = true }
e-agent-erp = { workspace = true }
e-agent-harness = { workspace = true }

[tool.ruff]
# Keep isort classifying e_agent as before the Phase 1 move, so moved code stays verbatim.
src = ["."]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT", "TID251"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through e_agent.server.environment (PR-37)."
"os.getenv".msg = "Read configuration through e_agent.server.environment (PR-37)."
"asyncio.create_task".msg = "Start background tasks through e_agent.sdk.tasks.supervised_task (PR-38)."

[tool.ruff.lint.per-file-ignores]
# TID251 bans os.environ/os.getenv (PR-37) and asyncio.create_task (PR-38) under src/e_agent;
# scripts, tools and tests are command-line entry points and stay out of scope. No file under
# src/ is exempt: the allowed calls carry line-level `# noqa: TID251` comments, pinned (file and
# banned API) by tests/conformance/test_banned_api.py.
"**/tests/**" = ["S", "B", "PT018", "TID251"]
"scripts/**" = ["S310", "S603", "S607", "TID251"]
"addons/**/__init__.py" = ["F401"]
"addons/**/__manifest__.py" = ["B018"]
"tools/harness/**" = ["S603", "S607", "TID251"]
".claude/hooks/**" = ["S603", "S607", "TID251"]
"tools/harness/src/e_agent_harness/gate.py" = ["S602", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "tools/harness/src"]
packages = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.plugins.erp.domain", "e_agent.server", "e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local", "e_agent.plugins.erp.odoo", "e_agent.plugins.erp.simulator", "e_agent_harness"]
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_packages = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.plugins.erp.domain", "e_agent.server", "e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local", "e_agent.plugins.erp.odoo", "e_agent.plugins.erp.simulator"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered dependency direction (HLD §4)"
type = "layers"
layers = [
    "e_agent.server",
    "e_agent.kernel | e_agent.adapters.shacl | e_agent.adapters.postgres | e_agent.adapters.pydantic_ai | e_agent.adapters.secretstore_local | e_agent.plugins.erp.odoo | e_agent.plugins.erp.simulator",
    "e_agent.plugins.erp.domain",
    "e_agent.sdk",
    "e_agent.contracts",
]

[[tool.importlinter.contracts]]
name = "Core never imports plugins"
type = "forbidden"
source_modules = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.server"]
forbidden_modules = ["e_agent.plugins.**"]

[[tool.importlinter.contracts]]
name = "Plugins are guests"
type = "forbidden"
source_modules = ["e_agent.plugins.erp.domain", "e_agent.plugins.erp.odoo", "e_agent.plugins.erp.simulator"]
forbidden_modules = ["e_agent.kernel", "e_agent.server", "e_agent.adapters.postgres", "e_agent.adapters.secretstore_local", "e_agent.adapters.pydantic_ai", "e_agent.adapters.shacl"]

[[tool.importlinter.contracts]]
name = "Only the facade module imports e_agent.kernel.coordinator"
type = "forbidden"
source_modules = [
    "e_agent.kernel.approval",
    "e_agent.kernel.approval_flow",
    "e_agent.kernel.connections",
    "e_agent.kernel.continuation",
    "e_agent.kernel.credentials",
    "e_agent.kernel.discovery",
    "e_agent.kernel.dispatch",
    "e_agent.kernel.errors",
    "e_agent.kernel.evidence",
    "e_agent.kernel.features",
    "e_agent.kernel.gateway",
    "e_agent.kernel.memory_store",
    "e_agent.kernel.policy",
    "e_agent.kernel.proposals",
    "e_agent.kernel.recovery",
    "e_agent.kernel.registry",
    "e_agent.kernel.run_loop",
    "e_agent.kernel.transitions",
    "e_agent.kernel.verification",
]
forbidden_modules = ["e_agent.kernel.coordinator"]

[[tool.importlinter.contracts]]
name = "Domain packs never import the kernel or server"
type = "forbidden"
source_modules = ["e_agent.plugins.erp.domain"]
forbidden_modules = ["e_agent.kernel", "e_agent.server", "e_agent.plugins.erp.simulator"]

[[tool.importlinter.contracts]]
name = "Adapters never import kernel, domains, server or sibling adapters"
type = "forbidden"
source_modules = ["e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local"]
forbidden_modules = ["e_agent.kernel", "e_agent.plugins.erp.domain", "e_agent.server", "e_agent.plugins.erp.simulator"]

[[tool.importlinter.contracts]]
name = "Provider adapters use only public domain APIs, never kernel, server or fixtures"
type = "forbidden"
source_modules = ["e_agent.plugins.erp.odoo", "e_agent.plugins.erp.simulator"]
forbidden_modules = ["e_agent.kernel", "e_agent.server", "e_agent.plugins.erp.domain.testing"]

[[tool.importlinter.contracts]]
name = "Server never imports the ERP simulator; profiles enable it (ADR 0026)"
type = "forbidden"
source_modules = ["e_agent.server"]
forbidden_modules = ["e_agent.plugins.erp.simulator"]

[[tool.importlinter.contracts]]
name = "ERP providers are independent of each other (ADR 0026)"
type = "independence"
modules = ["e_agent.plugins.erp.odoo", "e_agent.plugins.erp.simulator"]

[[tool.importlinter.contracts]]
name = "Domain bounded contexts are independent (ADR 0002)"
type = "independence"
modules = ["e_agent.plugins.erp.domain.procurement", "e_agent.plugins.erp.domain.inventory", "e_agent.plugins.erp.domain.sales", "e_agent.plugins.erp.domain.crm", "e_agent.plugins.erp.domain.receivables"]

[[tool.importlinter.contracts]]
name = "Product code never imports the development harness"
type = "forbidden"
source_modules = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.plugins.erp.domain", "e_agent.server", "e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local", "e_agent.plugins.erp.odoo", "e_agent.plugins.erp.simulator"]
forbidden_modules = ["e_agent_harness"]

[[tool.importlinter.contracts]]
name = "Core packages do not import agent frameworks or provider SDKs"
type = "forbidden"
source_modules = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.plugins.erp.domain"]
forbidden_modules = ["pydantic_ai", "httpx", "psycopg", "fastapi"]
# The one exemption ADR 0026 names: the common plugin SDK's HTTP helper (Task 1d.7b).
ignore_imports = ["e_agent.sdk.http -> httpx"]
