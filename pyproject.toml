[project]
name = "e-agent-workspace"
version = "0.0.0"
description = "Workspace root for e-agent (tooling only; not a distribution)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "e-agent-contracts",
    "e-agent-plugin-sdk",
    "e-agent-kernel",
    "e-agent-domain-erp",
    "e-agent-server",
    "e-agent-adapter-shacl",
    "e-agent-adapter-postgres",
    "e-agent-adapter-agent-pydantic",
    "e-agent-adapter-secretstore-local",
    "e-agent-adapter-odoo",
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/server"]

[tool.uv.sources]
e-agent-contracts = { workspace = true }
e-agent-plugin-sdk = { workspace = true }
e-agent-kernel = { workspace = true }
e-agent-domain-erp = { workspace = true }
e-agent-server = { workspace = true }
e-agent-adapter-shacl = { workspace = true }
e-agent-adapter-postgres = { workspace = true }
e-agent-adapter-agent-pydantic = { workspace = true }
e-agent-adapter-secretstore-local = { workspace = true }
e-agent-adapter-odoo = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "PT018"]
"scripts/**" = ["S310", "S603", "S607"]
"addons/**/__init__.py" = ["F401"]
"addons/**/__manifest__.py" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/contracts/src",
    "packages/plugin-sdk/src",
    "packages/kernel/src",
    "packages/domain-erp/src",
    "apps/server/src",
    "packages/adapter-shacl/src",
    "packages/adapter-postgres/src",
    "packages/adapter-agent-pydantic/src",
    "packages/adapter-secretstore-local/src",
    "packages/adapter-odoo/src",
]
packages = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.erp", "e_agent.server", "e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local", "e_agent.adapters.odoo"]
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "tests"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_packages = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.erp", "e_agent.server", "e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local", "e_agent.adapters.odoo"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered dependency direction (HLD §4)"
type = "layers"
layers = [
    "e_agent.server",
    "e_agent.kernel | e_agent.adapters.shacl | e_agent.adapters.postgres | e_agent.adapters.pydantic_ai | e_agent.adapters.secretstore_local | e_agent.adapters.odoo",
    "e_agent.erp",
    "e_agent.sdk",
    "e_agent.contracts",
]

[[tool.importlinter.contracts]]
name = "Kernel never imports domains or server"
type = "forbidden"
source_modules = ["e_agent.kernel"]
forbidden_modules = ["e_agent.erp", "e_agent.server"]

[[tool.importlinter.contracts]]
name = "Domain packs never import the kernel or server"
type = "forbidden"
source_modules = ["e_agent.erp"]
forbidden_modules = ["e_agent.kernel", "e_agent.server"]

[[tool.importlinter.contracts]]
name = "Adapters never import kernel, domains, server or sibling adapters"
type = "forbidden"
source_modules = ["e_agent.adapters.shacl", "e_agent.adapters.postgres", "e_agent.adapters.pydantic_ai", "e_agent.adapters.secretstore_local"]
forbidden_modules = ["e_agent.kernel", "e_agent.erp", "e_agent.server"]

[[tool.importlinter.contracts]]
name = "Provider adapters use only public domain APIs, never kernel, server or fixtures"
type = "forbidden"
source_modules = ["e_agent.adapters.odoo"]
forbidden_modules = ["e_agent.kernel", "e_agent.server", "e_agent.erp.testing"]

[[tool.importlinter.contracts]]
name = "Domain bounded contexts are independent (ADR 0002)"
type = "independence"
modules = ["e_agent.erp.procurement", "e_agent.erp.inventory"]

[[tool.importlinter.contracts]]
name = "Core packages do not import agent frameworks or provider SDKs"
type = "forbidden"
source_modules = ["e_agent.contracts", "e_agent.sdk", "e_agent.kernel", "e_agent.erp"]
forbidden_modules = ["pydantic_ai", "httpx", "psycopg", "fastapi"]
