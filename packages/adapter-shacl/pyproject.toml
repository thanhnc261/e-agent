[project]
name = "e-agent-adapter-shacl"
version = "0.1.0"
description = "SHACL validation engine adapter (pySHACL) for e-agent validation datasets"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk>=0.1,<0.2",
    "pyshacl>=0.40,<0.41",
    "rdflib>=7.6,<8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e_agent.adapters.shacl"
