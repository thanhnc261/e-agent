[project]
name = "e-agent-kernel"
version = "0.1.0"
description = "Domain-neutral run coordination, action gateway, approval and plugin registry"
requires-python = ">=3.12"
dependencies = ["e-agent-contracts>=0.1,<0.2", "e-agent-plugin-sdk>=0.1,<0.2"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e_agent.kernel"
