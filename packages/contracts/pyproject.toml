[project]
name = "e-agent-contracts"
version = "0.1.0"
description = "Portable wire records for e-agent (no framework or vendor types)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e_agent.contracts"
