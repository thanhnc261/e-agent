[project]
name = "e-agent-adapter-odoo"
version = "0.1.0"
description = "Odoo 19 JSON-2 provider adapter for e-agent (bridge commands, ADR 0005)"
requires-python = ">=3.12"
dependencies = [
    "e-agent-contracts>=0.1,<0.2",
    "e-agent-plugin-sdk>=0.1,<0.2",
    "e-agent-domain-erp>=0.1,<0.2",
    "httpx>=0.28,<1",
]

[project.entry-points."e_agent.plugins.v1"]
odoo19 = "e_agent.adapters.odoo.plugin:create_plugin"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e_agent.adapters.odoo"
