[project]
name = "e-agent-plugin-sdk"
version = "0.1.0"
description = "Public ports, manifests and plugin lifecycle for e-agent"
requires-python = ">=3.12"
dependencies = ["e-agent-contracts>=0.1,<0.2", "pydantic>=2.13,<3"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e_agent.sdk"
